name: Autonomous 24/7 Cloud Dispatcher (1,200 Daily Target)

on:
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch:
    inputs:
      target_count:
        description: 'Total daily target emails'
        required: false
        default: '1200'

concurrency:
  group: fzcore-cloud-dispatch
  cancel-in-progress: false

jobs:
  dispatch-pitches:
    name: Dual-Worker Cloud SMTP Dispatcher (Hostinger SSL)
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout Scraper Repo
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Dual-Worker Cloud SMTP Dispatcher & Follow-Ups
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          SUBDOMAIN_MAIL_PASS: ${{ secrets.SUBDOMAIN_MAIL_PASS }}
        run: |
          TARGET="${{ github.event.inputs.target_count || '1200' }}"
          echo "Starting Dual-Worker High-Velocity Dispatch Engine targeting $TARGET emails..."
          python outbound_engine/cloud_dispatcher.py "$TARGET" --surge
